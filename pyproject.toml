[project]
name = "job-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nayab-Sarfaraj", email = "nayabsarfaraj@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "langchain>=1.4.1",
    "langchain-core>=1.6.3",
    "langchain-groq>=1.1.3",
    "psycopg[binary]>=3.3.5",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
job-fastapi = "job_fastapi:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
